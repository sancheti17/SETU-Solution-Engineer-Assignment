services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_PATH: /var/data/payments.db
      API_KEY: ${API_KEY:-}
      REQUIRE_API_KEY: ${REQUIRE_API_KEY:-false}
      SETTLEMENT_GRACE_HOURS: ${SETTLEMENT_GRACE_HOURS:-24}
    volumes:
      - payments-data:/var/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  payments-data:
